version: '3'
services:
  couchbase:
    container_name: couchbase
    image: couchbase-nosetup:community-7.1.1
    build:
      dockerfile: couchbase.Dockerfile
    ports:
      - "8091-8094:8091-8094"
      - "11210:11210"
    networks:
      - couchbase
  server:
    container_name: server
    restart: on-failure
    image: ab-stract:latest
    # Optional private registry image. Public checkouts should build and tag locally.
    ports:
      - "8080:8080"
      - "7001:7001"
      - "7002:7002"
    networks:
      - couchbase
    environment:
      SPRING_APPLICATION_JSON: '{
          "spring.couchbase.connectionString": "couchbase://couchbase"
      }'
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
networks:
  couchbase:
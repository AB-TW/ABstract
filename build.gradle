buildscript {
    ext {
        springBootVersion = '4.0.6'
        caffeineVersion = '3.1.8'
        springAiVersion = '2.0.0-M4'
    }
}

plugins {
    id "org.springframework.boot" version "${springBootVersion}" apply false
    id "io.spring.dependency-management" version "1.1.7" apply false
    id "org.owasp.dependencycheck" version "11.1.1" apply false
    id "org.flywaydb.flyway" version "9.22.1" apply false
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

subprojects { sub ->
    sub.plugins.withId('org.owasp.dependencycheck') {
        sub.dependencyCheck {
            nvd {
                apiKey = System.getenv('NVD_API_KEY') ?: ''
            }
            data {
                directory = file("${rootDir}/.dependency-check-data")
            }
        }
    }
}
plugins {
    id 'java'
    id 'io.spring.dependency-management'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'org.owasp.dependencycheck'
}

group 'cn.dpc.ab'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    testImplementation  'org.junit.jupiter:junit-jupiter-api'
    testImplementation  'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    implementation 'io.projectreactor:reactor-core'

    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'io.projectreactor:reactor-test'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
}

checkstyle {
    toolVersion = '10.10.0'
    sourceSets = [sourceSets.main]
    ignoreFailures = false
    maxWarnings = 0
    configFile file("${rootDir}/config/checkstyle/checkstyle.xml")
}

checkstyleMain {
    source = ["src/main/java"]
}

checkstyleTest {
    source = ["src/test/java"]
}

check.dependsOn 'checkstyleMain'
check.dependsOn 'checkstyleTest'

pmd {
    toolVersion = '6.52.0'
    sourceSets = [sourceSets.main]
    ruleSets = ["${rootDir}/config/pmd/pmd-ruleset.xml"]
    rulesMinimumPriority = 3
    ignoreFailures = false
    consoleOutput = true
}

check.dependsOn 'pmdMain'
check.dependsOn 'pmdTest'

task installGitHooks(type: Copy) {
    from new File(rootProject.rootDir, 'config/git-hook/')
    into {
        new File(rootProject.rootDir, '.git/hooks')
    }
    fileMode 0755
}

compileJava.dependsOn installGitHooks

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}
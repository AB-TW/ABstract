plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'pmd'
    id 'org.owasp.dependencycheck'
}

group 'cn.dpc.ab'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation  'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation  'org.junit.jupiter:junit-jupiter-params:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    compileOnly 'org.projectlombok:lombok:1.18.26'
    annotationProcessor 'org.projectlombok:lombok:1.18.26'
    implementation 'io.projectreactor:reactor-core:3.5.5'

    testCompileOnly 'org.projectlombok:lombok:1.18.26'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.26'
    testImplementation 'org.mockito:mockito-core:5.2.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.2.0'
    testImplementation 'io.projectreactor:reactor-test:3.5.5'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
}

checkstyle {
    toolVersion = '10.10.0'
    sourceSets = [sourceSets.main]
    ignoreFailures = false
    maxWarnings = 0
    configFile file("${rootDir}/config/checkstyle/checkstyle.xml")
}

checkstyleMain {
    source = ["src/main/java"]
}

checkstyleTest {
    source = ["src/test/java"]
}

check.dependsOn 'checkstyleMain'
check.dependsOn 'checkstyleTest'

pmd {
    toolVersion = '6.52.0'
    sourceSets = [sourceSets.main]
    ruleSets = ["${rootDir}/config/pmd/pmd-ruleset.xml"]
    rulesMinimumPriority = 3
    ignoreFailures = false
    consoleOutput = true
}

check.dependsOn 'pmdMain'
check.dependsOn 'pmdTest'

task installGitHooks(type: Copy) {
    from new File(rootProject.rootDir, 'config/git-hook/')
    into {
        new File(rootProject.rootDir, '.git/hooks')
    }
    fileMode 0755
}

compileJava.dependsOn installGitHooks

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}
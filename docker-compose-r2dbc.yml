version: '4'
services:
  postgres:
    container_name: abstract-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: abstract
      POSTGRES_USER: abstract
      POSTGRES_PASSWORD: abstract
    ports:
      - "5432:5432"
    networks:
      - r2dbc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abstract -d abstract"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  r2dbc:

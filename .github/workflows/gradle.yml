# github action workflow file, use gradle wrapper to build
name: Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v2
        - name: 'Set up JDK 17'
          uses: actions/setup-java@v2
          with:
            java-version: '17'
            distribution: 'adopt'
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew
        - name: Build with Gradle
          run: ./gradlew build
        - name: Dependency Check
          run: ./gradlew dependencyCheckAnalyze
        - name: Build frontend with Gradle
          run: ./gradlew npmBuild
        - name: Build Docker image
          run: docker build -t a_bstract/abstract:latest .
        - name: Login Docker registry
          run: docker login --username=$REGISTRY_USERNAME --password=$REGISTRY_PASSWORD registry.cn-wulanchabu.aliyuncs.com
        - name: Tag Docker image
          run: docker tag a_bstract/abstract:latest registry.cn-wulanchabu.aliyuncs.com/pc-dong/ab-stract:latest
        - name: Push Docker image
          run: docker push registry.cn-wulanchabu.aliyuncs.com/pc-dong/ab-stract:latest

# github action workflow file, use gradle wrapper to build
name: Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v2
        - name: 'Set up JDK 17'
          uses: actions/setup-java@v2
          with:
            java-version: '17'
            distribution: 'adopt'
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew
        - name: Build with Gradle
          run: ./gradlew build
#        - name: Build frontend with Gradle
#          run: ./gradlew npmBuildProd
        - name: Build Docker image
          run: docker build -t a_bstract/abstract:latest .

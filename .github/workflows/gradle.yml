# github action workflow file, use gradle wrapper to build
name: Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: 'Set up JDK 21'
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew
        - name: Build with Gradle
          run: ./gradlew build
        - name: Cache OWASP Dependency-Check NVD data
          uses: actions/cache@v4
          with:
            path: .dependency-check-data
            key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/gradle.lockfile', '**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
            restore-keys: |
              owasp-nvd-${{ runner.os }}-
        - name: Dependency Check
          env:
            NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          run: |
            if [ -z "${NVD_API_KEY}" ]; then
              echo "::error::NVD_API_KEY repository secret is required. Request a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a GitHub Actions secret."
              exit 1
            fi
            ./gradlew dependencyCheckAggregate --no-parallel --no-daemon
        - name: Build frontend with Gradle
          run: ./gradlew npmBuild
        - name: Build Docker image
          run: docker build -t a_bstract/abstract:latest .
        # Publish is opt-in. Public forks should leave these secrets unset and skip the push.
        # Do not store the registry password in Actions variables.
        # All four secrets are required before login/push runs:
        #   REGISTRY_HOST, REGISTRY_USERNAME, REGISTRY_PASSWORD, REGISTRY_IMAGE
        # REGISTRY_IMAGE is the full reference, for example registry.example.com/org/ab-stract:latest
        - name: Detect registry credentials
          id: registry
          env:
            REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
            REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
            REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
            REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
          run: |
            if [ -n "${REGISTRY_HOST}" ] && [ -n "${REGISTRY_USERNAME}" ] && [ -n "${REGISTRY_PASSWORD}" ] && [ -n "${REGISTRY_IMAGE}" ]; then
              echo "push=true" >> "${GITHUB_OUTPUT}"
            else
              echo "push=false" >> "${GITHUB_OUTPUT}"
              echo "Registry secrets are incomplete. Skipping docker login and push."
              echo "Public forks should keep this skipped."
            fi
        - name: Login Docker registry
          if: steps.registry.outputs.push == 'true'
          env:
            REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
            REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
            REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          run: echo "${REGISTRY_PASSWORD}" | docker login --username "${REGISTRY_USERNAME}" --password-stdin "${REGISTRY_HOST}"
        - name: Tag and push Docker image
          if: steps.registry.outputs.push == 'true'
          env:
            REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
          run: |
            docker tag a_bstract/abstract:latest "${REGISTRY_IMAGE}"
            docker push "${REGISTRY_IMAGE}"

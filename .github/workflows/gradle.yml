# github action workflow file, use gradle wrapper to build
name: Build
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: 'Set up JDK 21'
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew
        - name: Build with Gradle
          run: ./gradlew build
        - name: Cache OWASP Dependency-Check NVD data
          uses: actions/cache@v4
          with:
            path: .dependency-check-data
            key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/gradle.lockfile', '**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
            restore-keys: |
              owasp-nvd-${{ runner.os }}-
        - name: Dependency Check
          env:
            NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          run: |
            if [ -z "${NVD_API_KEY}" ]; then
              echo "::error::NVD_API_KEY repository secret is required. Request a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a GitHub Actions secret."
              exit 1
            fi
            ./gradlew dependencyCheckAggregate --no-parallel --no-daemon
        - name: Build frontend with Gradle
          run: ./gradlew npmBuild
        - name: Build Docker image
          run: docker build -t a_bstract/abstract:latest .
        - name: Login Docker registry
          run: docker login --username ${{ vars.REGISTRY_USERNAME }} --password ${{ vars.REGISTRY_PASSWORD }} registry.cn-wulanchabu.aliyuncs.com
        - name: Tag Docker image
          run: docker tag a_bstract/abstract:latest registry.cn-wulanchabu.aliyuncs.com/pc-dong/ab-stract:latest
        - name: Push Docker image
          run: docker push registry.cn-wulanchabu.aliyuncs.com/pc-dong/ab-stract:latest

server:
  port: 8080

spring:
  r2dbc:
    url:

---
spring:
  config:
    activate:
      on-profile: default
  r2dbc:
    url: r2dbc:h2:file:///./tmp/test-database
  flyway:
    url: jdbc:h2:file:./tmp/test-database
    locations: classpath:db/migration
    enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/abstract}
    username: ${R2DBC_USERNAME:abstract}
    password: ${R2DBC_PASSWORD:abstract}
  flyway:
    enabled: true
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5432/abstract}
    user: ${FLYWAY_USER:abstract}
    password: ${FLYWAY_PASSWORD:abstract}
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: info
    cn.dpc.ab: debug

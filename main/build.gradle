plugins {
    id 'api'
    id 'org.springframework.boot'
//    id 'ai'  // Temporarily disabled - Spring AI 2.0.0-M4 not yet available
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}


dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation project(':api:api-feature')
    implementation project(':api:api-customer')
    implementation project(':api:api-experiment')
    implementation project(':api:api-filterCondition')
    implementation project(':persistent:persistent-core')
    implementation project(':persistent:persistent-feature')
    implementation project(':persistent:persistent-customer')
    implementation project(':persistent:persistent-experiment')
    implementation project(':persistent:persistent-filterCondition')
//    implementation project(':api:api-ai')  // Temporarily disabled
//    implementation project(':persistent:ai-openai')  // Temporarily disabled
//    implementation project(':persistent:ai-zhipu')
//    implementation project(':persistent:ai-ollama')
}

bootRun {
    workingDir = file('..')
}

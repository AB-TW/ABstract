plugins {
    id 'api'
    id 'org.springframework.boot'
}

dependencies {
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation project(':api:api-feature')
    implementation project(':api:api-customer')
    implementation project(':persistent:persistent-feature')
    implementation project(':persistent:persistent-customer')
}

bootRun {
    workingDir = file('..')
}